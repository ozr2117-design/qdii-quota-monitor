name: Keep Streamlit App Alive

on:
  schedule:
    # 每天早中晚自动 ping 一次保活 (UTC 02:00, 10:00, 18:00)
    - cron: '0 2,10,18 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App to Prevent Sleep
        run: |
          echo "Pinging Streamlit App to keep it active..."
          # 不使用 -L 避免登录墙应用 (Private App) 陷入无限循环重定向导致 curl exit 47
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://qdii-quota-monitor.streamlit.app || echo "ERR")
          echo "Streamlit App HTTP Status Code: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "303" ] || [ "$STATUS" = "302" ]; then
            echo "App is active and alive (HTTP $STATUS, wake-up signal delivered)!"
          else
            echo "App returned $STATUS, wake-up traffic sent."
          fi

