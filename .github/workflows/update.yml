name: Update QDII Fund Quota Data

on:
  schedule:
    # 1. 早盘前 08:45 (UTC 00:45) - 捕捉直销系统早间重置与昨日公告生效
    - cron: '45 0 * * 1-5'
    # 2. 盘中巡检 10:30 (UTC 02:30) - 捕捉早盘放水量是否被抢空变灰
    - cron: '30 2 * * 1-5'
    # 3. 申购截止前关键窗口 14:00 (UTC 06:00) - 15:00交易截止前最后申购决策
    - cron: '0 6 * * 1-5'
    # 4. 盘后清算 16:30 (UTC 08:30) - 盘后收盘状态确认
    - cron: '30 8 * * 1-5'
    # 5. 晚间公告高峰 20:30 (UTC 12:30) - 捕捉各大公募次日限购/放宽公告
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 随时可在网页或命令行手动一键触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Fund Quotas
        run: |
          python fetcher.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update fund quota data [skip ci]" || exit 0
          git push
