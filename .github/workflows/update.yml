name: Update QDII Fund Quota Data

on:
  schedule:
    # UTC 时间 01:30 (北京时间 09:30 - 早盘前)
    - cron: '30 1 * * 1-5'
    # UTC 时间 07:30 (北京时间 15:30 - 盘后更新)
    - cron: '30 7 * * 1-5'
    # UTC 时间 13:00 (北京时间 21:00 - 晚间各基金公司公告后)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Latest Fund Quotas
        run: |
          python fetcher.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update fund quota data [skip ci]" || exit 0
          git push
